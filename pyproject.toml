[project]
name = "investment-research-copilot"
version = "0.1.0"
description = "Weekly research and recommendation system for gold, funds, and ETFs."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "click>=8.1",
    "frozendict>=2.4",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "openbb>=4.3",
    "akshare>=1.13",
    "feedparser>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
irc = "irc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irc"]

[tool.hatch.build.targets.wheel.force-include]
"src/irc/templates" = "irc/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "respx>=0.23.1",
]
