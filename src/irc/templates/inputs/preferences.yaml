# Investment Research Copilot — preferences (gold-20 starter)
risk_band:
  max_drawdown: [0.10, 0.20]
  horizon: long_core_medium_rotation

universe:
  cn_funds: true
  cn_etfs: true
  hk_etfs: true
  us_etfs: true

asset_class_targets:
  gold:           { center: 0.20, band: [0.12, 0.28] }
  cn_equity_fund: { center: 0.15, band: [0.10, 0.25] }
  cn_etf:         { center: 0.10, band: [0.05, 0.20] }
  cn_bond_fund:   { center: 0.15, band: [0.10, 0.25] }
  hk_etf:         { center: 0.10, band: [0.05, 0.15] }
  us_etf:         { center: 0.25, band: [0.18, 0.35] }
  cash:           { center: 0.05, band: [0.00, 0.10] }

currency_tolerance:
  cny: [0.40, 0.65]
  usd: [0.25, 0.45]
  hkd: [0.05, 0.20]

# Optional. Declare your FX-hedge policy so the memo's risk-notes can frame
# unhedged USD exposure as a deliberate choice instead of "数据未配置".
# policy:
#   accept_unhedged — no hedge; the memo warns only when USD weight breaks
#                     the currency_tolerance.usd band above.
#   hedged          — you've registered a CNY-hedged USD instrument elsewhere.
# Omit the block entirely to keep the legacy "数据未配置" warning.
fx_hedge:
  policy: accept_unhedged
  notes: "USD 敞口在容忍带内不对冲；超出容忍带时再考虑临时对冲工具"

constraints:
  allow_short: false
  allow_leverage: false
  exclude_themes: []

investment_plan:
  monthly_new_capital_cny: 0    # fill once you decide your monthly contribution

report_language: zh
