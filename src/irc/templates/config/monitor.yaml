# config/monitor.yaml — source of truth for `irc monitor` RUNTIME CONFIG (funds, themes,
# bands, confidence). Factor WEIGHTS are NOT governed here: they live in
# src/irc/monitor/profiles.py (per-profile vectors) + an optional per-fund `signal_weights`
# override below, validated at load time. See ADR 0018 D2.
schema_version: 1

history:
  minimum_observations: 251
  fetch_calendar_days: 550

defaults:
  return_windows: [5, 20, 60, 120, 250]
  # Weights live in src/irc/monitor/profiles.py (per-profile vectors), overlaid by
  # an optional per-fund `signal_weights` on a fund below — NOT here. See ADR 0018 D2.
  signal_bands:
    buy: 0.40
    sell: -0.40
  minimum_confidence: 0.50

funds:
