[project]
name = "investment-research-copilot"
version = "0.1.0"
description = "Weekly research and recommendation system for gold, funds, and ETFs."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "click>=8.1",
    "frozendict>=2.4",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "openbb>=4.3",
    "akshare>=1.13",
    "feedparser>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Optional CN-fundamentals fallback provider. Lazy-imported only inside
# `_tushare_call`; `default_cn_provider()` warns + degrades to AkShare-only when
# a TUSHARE_TOKEN is set but this extra is absent. Pulls ~60 MB (lxml/requests).
tushare = [
    "tushare>=1.4",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "ruff>=0.4",
    "hypothesis>=6.100",
]

[project.scripts]
irc = "irc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irc", "evals"]

[tool.hatch.build.targets.wheel.force-include]
"src/irc/templates" = "irc/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers"]
markers = [
    "live_akshare: hits the real AkShare network. Run via `pytest -m live_akshare` with IRC_RUN_LIVE_AKSHARE=1. Excluded from default `pytest` runs.",
    "live_tushare: hits the real Tushare network (api.tushare.pro). Run via `pytest -m live_tushare` with IRC_RUN_LIVE_TUSHARE=1 and a real TUSHARE_TOKEN. Excluded from default `pytest` runs.",
    "live_balance: hits real provider balance endpoints. Run via `pytest -m live_balance` with IRC_RUN_LIVE_BALANCE=1 and real API keys. Excluded from default `pytest` runs.",
    "live_llm: hits a real LLM provider endpoint. Run via `pytest -m live_llm` with RUN_LIVE_LLM_TESTS=1 and provider API keys. Excluded from default `pytest` runs.",
    "integration: integration test exercising multiple modules end-to-end (no external network). Currently used by tests/integration/test_thesis_coverage.py.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "respx>=0.23.1",
    "hypothesis>=6.100",
]
