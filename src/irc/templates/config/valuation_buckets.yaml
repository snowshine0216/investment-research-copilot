buckets:
  - { max_percentile: 0.30, buy_method: lump_sum,              granularity: "1-2 tranches" }
  - { max_percentile: 0.60, buy_method: dca_weekly,            granularity: "12-16 weeks" }
  - { max_percentile: 0.80, buy_method: dca_weekly_slow,       granularity: "24-26 weeks" }
  - { max_percentile: 0.95, buy_method: dca_monthly_threshold, granularity: "36+ weeks" }
  - { max_percentile: 1.00, buy_method: suspend,               granularity: "n/a" }

active_fund_lookthrough:
  enabled: true           # Phase D PR2 (2026-06-05): active funds use the PE anchor
  coverage_floor: 0.50    # ratio of NAV; covered A-share weight must meet this (gate-#5 decision)
  pb_uses_pe_gate: false  # PB stays on the <30 floor, not 120/180 (§3.3)

sector_index_grounding:
  activated_slugs: []   # B1: empty (accumulate only; output byte-identical).
                        # B2: reviewed mature slugs added after gate #5.
